<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Registration Form</title>
</head>
<body>
  <h2>Registration Form</h2>
  <form action="register.php" method="post">

    <label for="name">Full Name:</label>
    <input type="text" id="name" name="name" placeholder="Enter name"><br><br>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email"><br><br>

    <label for="pass">Password:</label>
    <input type="password" id="pass" name="pass"><br><br>

    <label>Gender:</label>
    <input type="radio" id="m" name="gender" value="Male"><label for="m">Male</label>
    <input type="radio" id="f" name="gender" value="Female"><label for="f">Female</label><br><br>

    <label>Hobbies:</label>
    <input type="checkbox" name="hobby" value="Reading"> Reading
    <input type="checkbox" name="hobby" value="Music"> Music
    <input type="checkbox" name="hobby" value="Sports"> Sports<br><br>

    <label for="dob">Date of Birth:</label>
    <input type="date" id="dob" name="dob"><br><br>

    <label for="course">Course:</label>
    <select id="course" name="course">
      <option>BCA</option>
      <option>BBA</option>
      <option>MCA</option>
    </select><br><br>

    <label for="addr">Address:</label><br>
    <textarea id="addr" name="addr" rows="3" cols="30"></textarea><br><br>

    <input type="submit" value="Register">
    <input type="reset" value="Clear">
  </form>
</body>
</html>
