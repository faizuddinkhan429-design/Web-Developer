<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap Grid</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
  <div class="container-fluid bg-primary text-white text-center p-3">
    <h1>Bootstrap Responsive Grid</h1>
  </div>

  <div class="container mt-4">
    <div class="row">
      <div class="col-lg-4 col-md-6 col-12">
        <div class="p-3 bg-success text-white mb-3">Column 1</div>
      </div>
      <div class="col-lg-4 col-md-6 col-12">
        <div class="p-3 bg-danger text-white mb-3">Column 2</div>
      </div>
      <div class="col-lg-4 col-md-12 col-12">
        <div class="p-3 bg-warning mb-3">Column 3</div>
      </div>
    </div>

    <div class="row">
      <div class="col-sm-8"><div class="p-3 bg-info">col-sm-8</div></div>
      <div class="col-sm-4"><div class="p-3 bg-secondary text-white">col-sm-4</div></div>
    </div>
  </div>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
  </script>
</body>
</html>
